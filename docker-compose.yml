services:
  wedding-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-saas
    restart: unless-stopped
    environment:
      - PORT=8080
      - STATIC_DIR=/srv/app/public
      - TZ=America/Sao_Paulo
    volumes:
      - wedding_data:/srv/app/data
    networks:
      - webproxy
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true

volumes:
  wedding_data:

networks:
  webproxy:
    external: true
